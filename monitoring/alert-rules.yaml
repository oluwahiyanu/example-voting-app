apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: robot-shop-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: robot-shop-availability
      rules:
        - alert: RobotShopWebDown
          expr: kube_deployment_status_replicas_available{namespace="robot-shop",deployment="web"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: The Robot Shop web service has no healthy pods.
            runbook_url: https://github.com/oluwahiyanu/robot-shop/blob/main/docs/runbook.md
