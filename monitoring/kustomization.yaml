apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - robot-shop-monitoring.yaml
configMapGenerator:
  - name: robot-shop-dashboard
    files:
      - dashboard/robot-shop.json
    options:
      labels:
        grafana_dashboard: "1"
        release: monitoring
      disableNameSuffixHash: true
