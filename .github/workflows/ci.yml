name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  vote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check vote app compiles
        run: python3 -m py_compile vote/app.py
      - name: Check result app syntax
        run: node --check result/server.js

      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build vote image
        run: docker build -t ghcr.io/$OWNER/vote:${{ github.sha }} ./vote

      - name: Scan vote image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/vote:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push vote image
        run: docker push ghcr.io/$OWNER/vote:${{ github.sha }}

  result:
    needs: vote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build result image
        run: docker build -t ghcr.io/$OWNER/result:${{ github.sha }} ./result

      - name: Scan result image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/result:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push result image
        run: docker push ghcr.io/$OWNER/result:${{ github.sha }}

  worker:
    needs: result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check worker builds
        run: docker run --rm -v "$GITHUB_WORKSPACE/worker:/source" -w /source mcr.microsoft.com/dotnet/sdk:8.0 dotnet build Worker.csproj --configuration Release

      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker image
        run: docker build -t ghcr.io/$OWNER/worker:${{ github.sha }} ./worker

      - name: Scan worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/worker:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push worker image
        run: docker push ghcr.io/$OWNER/worker:${{ github.sha }}

  deploy:
    needs: [vote, result, worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Connect to the cluster
        run: aws eks update-kubeconfig --region eu-north-1 --name capstone-cluster
      - name: Deploy voting app with Helm
        run: |
          helm upgrade --install voting ./helm/voting-app \
            --namespace default \
            --set apps.vote.tag=${{ github.sha }} \
            --set apps.result.tag=${{ github.sha }} \
            --set apps.worker.tag=${{ github.sha }} \
            --force-conflicts
          kubectl rollout status deployment/db --timeout=180s
          kubectl rollout status deployment/redis --timeout=180s
          kubectl rollout status deployment/vote --timeout=180s
          kubectl rollout status deployment/result --timeout=180s
          kubectl rollout status deployment/worker --timeout=180s