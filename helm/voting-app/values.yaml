apps:
  vote:
    image: ghcr.io/oluwahiyanu/vote
    tag: latest
    port: 8080
    replicas: 2
    serviceType: LoadBalancer
    servicePort: 80
  result:
    image: ghcr.io/oluwahiyanu/result
    tag: latest
    port: 8080
    replicas: 1
    serviceType: LoadBalancer
    servicePort: 80
  worker:
    image: ghcr.io/oluwahiyanu/worker
    tag: latest
    replicas: 1
  redis:
    image: redis
    tag: 7.2-alpine
    port: 6379
    replicas: 1
  db:
    image: postgres
    tag: 16-alpine
    port: 5432
    replicas: 1
    env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: postgres