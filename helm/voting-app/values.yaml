apps:
  vote:
    image: ghcr.io/oluwahiyanu/vote
    tag: latest
    port: 8080
    replicas: 1
    serviceType: LoadBalancer
    servicePort: 80
  result:
    image: ghcr.io/oluwahiyanu/result
    tag: latest
    port: 8080
    replicas: 1
    serviceType: LoadBalancer
    servicePort: 80
  worker:
    image: ghcr.io/oluwahiyanu/worker
    tag: latest
    replicas: 1
  redis:
    image: redis
    tag: alpine
    port: 6379
    replicas: 1
  db:
    image: postgres
    tag: 15-alpine
    port: 5432
    replicas: 1
    containerName: postgres
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: postgres